name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Run unit tests
        run: bun test tests/schemas.test.ts

      - name: Run integration tests
        if: ${{ secrets.INWX_OTE_USERNAME != '' }}
        env:
          INWX_USERNAME: ${{ secrets.INWX_OTE_USERNAME }}
          INWX_PASSWORD: ${{ secrets.INWX_OTE_PASSWORD }}
          INWX_ENVIRONMENT: ote
        run: bun test tests/integration.test.ts

      - name: Run lifecycle tests
        if: ${{ secrets.INWX_OTE_USERNAME != '' }}
        env:
          INWX_USERNAME: ${{ secrets.INWX_OTE_USERNAME }}
          INWX_PASSWORD: ${{ secrets.INWX_OTE_PASSWORD }}
          INWX_ENVIRONMENT: ote
        run: |
          bun test tests/lifecycle.test.ts
          bun test tests/lifecycle-com.test.ts

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check
